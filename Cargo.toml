[workspace]
resolver = "2"
members = [
  "crates/keyring-core",
  "crates/keyring-provider",
  "crates/keyring-protocol",
  "crates/keyring-store-memory",
  "crates/keyring-store-keychain",
  "crates/keyring-store-freedesktop",
  "crates/keyring-cli",
]

[workspace.package]
rust-version = "1.89"
edition = "2024"
license = "MIT"
version = "0.2.0-alpha1"

[workspace.dependencies]
anyhow = "1.0.102"
bitwarden-api-api = "2.0.0"
bitwarden-api-identity = "2.0.0"
bitwarden-crypto = "2.0.0"
clap = { version = "4.5.38", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
ed25519-dalek = "2.2.0"
keyring-protocol = { path = "crates/keyring-protocol" }
keyring-provider = { path = "crates/keyring-provider" }
keyring-core = { path = "crates/keyring-core" }
keyring-store-memory = { path = "crates/keyring-store-memory" }
keyring-store-keychain = { path = "crates/keyring-store-keychain" }
keyring-store-freedesktop = { path = "crates/keyring-store-freedesktop" }
libc = "0.2.186"
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls-webpki-roots-no-provider",
] }
rsa = "0.9.10"
rand = "0.8.5"
secrecy = "0.10.3"
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
signature = "2.2.0"
ssh-agent-lib = "0.5.2"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa"] }
ssh-encoding = "0.2.0"
tempfile = "3.23.0"
thiserror = "2.0.18"
time = { version = "=0.3.47", features = ["formatting"] }
tokio = { version = "1.48.0", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
  "signal",
] }
tokio-util = "0.7.18"
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.2"
zbus = { version = "6.2.1", default-features = false, features = [
  "tokio",
  "proxy",
] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
core-foundation = "0.10.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
] }

[workspace.lints.rust]
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
