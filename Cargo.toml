[workspace]
resolver = "2"
members = [
  "crates/keyring-core",
  "crates/keyring-provider",
  "crates/keyring-protocol",
  "crates/keyring-store-memory",
  "crates/keyring-store-keychain",
  "crates/keyring-store-freedesktop",
  "crates/keyring-cli",
]

[workspace.package]
rust-version = "1.99"
edition = "2024"
license = "MIT"
version = "0.2.0-alpha3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[workspace.dependencies]
# Workspace crates
keyring-core = { path = "crates/keyring-core" }
keyring-protocol = { path = "crates/keyring-protocol" }
keyring-provider = { path = "crates/keyring-provider" }
keyring-store-memory = { path = "crates/keyring-store-memory" }
keyring-store-keychain = { path = "crates/keyring-store-keychain" }
keyring-store-freedesktop = { path = "crates/keyring-store-freedesktop" }

# Third-party dependencies
anyhow = "1.0.104"
bitwarden-crypto = "4.0.0"
chrono = "0.4.45"
clap = "4.6.7"
comfy-table = "8.0.1"
ed25519-dalek = "3.0.0"
libc = "0.2.191"
region = "4.0.1"
reqwest = "0.13.5"
rpassword = "7.5.5"
rsa = "0.10.0"
rand = "0.10.3"
secrecy = "0.10.3"
rustls = "0.23.46"
serde = "1.0.229"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
signature = "2.2.0"
ssh-agent-lib = "0.6.0"
ssh-key = "0.6.7"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.29.2"
zeroize = "1.9.1"
zbus = "6.2.1"
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
core-foundation = "0.10.1"
windows = "0.62.2"

[workspace.lints.rust]
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
