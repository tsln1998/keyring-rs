[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
rust-version = "1.89"
edition = "2024"
license = "MIT"
version = "0.1.2"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bitwarden-api-api = "2.0.0"
bitwarden-api-identity = "2.0.0"
bitwarden-crypto = "2.0.0"
clap = { version = "4.5.38", features = ["derive"] }
futures-util = "0.3.32"
indoc = "2.0.7"
itertools = "0.14.0"
keyring-core = { path = "crates/keyring-core" }
keyring-providers = { path = "crates/keyring-providers" }
keyring-service = { path = "crates/keyring-service" }
libc = "0.2.186"
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls-webpki-roots-no-provider",
] }
rsa = "0.9.10"
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
signature = "2.2.0"
ssh-agent-lib = "0.5.2"
ssh-key = "0.6.7"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
  "signal",
] }
tokio-util = "0.7.18"
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
] }

[workspace.lints.rust]
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
