schema: spec-driven

context: |
  Project: keyring-rs, a Bitwarden-only SSH agent.
  Specifications and implementation documentation are written in English.
  The foreground service starts locked. Unlock, lock, and status commands use extensions
  on the SSH agent socket. Refresh is a client-side lock followed by reconnect and unlock,
  with a fresh terminal-only password prompt. Configuration contains one mandatory
  [bitwarden] table with API credentials and no master password.

  Workspace:
  - keyring-core: synchronous Store contracts, public metadata, shared software signing.
  - keyring-provider: Bitwarden authentication, account crypto, sync and SSH material decryption.
  - keyring-protocol: ssh-agent-lib, lifecycle, selection, reconciliation, control extensions.
  - keyring-store-memory: ephemeral software signing and reusable store contract.
  - keyring-store-keychain: macOS Keychain storage and platform RSA/software Ed25519 signing.
  - keyring-store-freedesktop: Linux Secret Service storage and software signing.
  - keyring-cli: configuration, commands, transport, sockets, signals, platform assembly.

  Architecture:
  - Core has no runtime, network, or platform dependencies.
  - Backends depend on core, never on provider, protocol, or ssh-agent-lib.
  - Protocol depends on core and provider, never on concrete store crates.
  - CLI selects platform crates with target dependencies, without backend features.
  - Fixed per-key store priority is Keychain > FreeDesktop > Memory.
  - Every backend implements sign; protocol retains only public records and opaque handles.
  - Bitwarden sessions, tokens, and account crypto exist only for a single explicit load.
  - The service never refreshes automatically or contacts Bitwarden for SSH requests or status.
  - Refresh composes existing lock and unlock extensions; there is no server refresh operation.
  - Ed25519 always uses software signing. Linux has no hardware signing backend.
  - Imported Keychain RSA uses platform signing; hardware execution is not guaranteed.
  - Secure Enclave, provider plugins, dummy providers, multi-account configuration,
    compatibility aliases, and stored master passwords are out of scope.

  Prefer explicit boundaries, typed data, conservative logging, zeroized secret buffers,
  transactional state changes, independent signature verification, and minimal dependencies.
  Preserve Windows pipes, Unix reload/drain, per-request deadlines, and static musl releases.
  Do not claim real platform security properties based on mock tests.

rules:
  proposal:
    - State goals, scope, non-goals, crate impact, risks, and unresolved platform facts.
    - Keep store and Bitwarden responsibilities separate.
  spec:
    - Write specifications in English and organize them by crate.
    - Separate contracts from platform wiring.
    - Describe locked/loading/unlocked behavior and cancellation where relevant.
    - Distinguish verified software behavior from manual platform acceptance.
  tasks:
    - Break work by crate and keep task descriptions in English.
    - Include behavioral checks for crypto, state transitions, protocol, and sockets.
    - Do not rewrite historical archived changes.
