[package]
name = "keyring-cli"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
version.workspace = true

[lib]
name = "keyring_cli"
path = "src/lib.rs"

[[bin]]
name = "keyring"
path = "src/main.rs"

[[test]]
name = "lifecycle"
path = "src/app.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
comfy-table.workspace = true
keyring-protocol.workspace = true
keyring-provider.workspace = true
keyring-core.workspace = true
keyring-store-memory.workspace = true
rpassword = "7.4.0"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
ssh-encoding.workspace = true
ssh-agent-lib.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring-store-freedesktop.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring-store-keychain.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
bitwarden-crypto.workspace = true
signature.workspace = true
ssh-key.workspace = true
tempfile.workspace = true

[lints]
workspace = true
