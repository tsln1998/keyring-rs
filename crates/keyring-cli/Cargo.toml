[package]
name = "keyring-cli"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
version.workspace = true

[lib]
name = "keyring_cli"
path = "src/lib.rs"

[[bin]]
name = "keyring"
path = "src/main.rs"

[[test]]
name = "lifecycle"
path = "src/app.rs"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
clap.workspace = true
comfy-table.workspace = true
keyring-protocol.workspace = true
keyring-provider.workspace = true
keyring-core.workspace = true
keyring-store-memory.workspace = true
rpassword.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
ssh-agent-lib.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

# Default features
comfy-table.default-features = false
rustls.default-features = false
toml.default-features = false

# Features
clap.features = [
  "derive",
]
rustls.features = [
  "ring",
  "std",
  "tls12",
]
serde.features = [
  "derive",
]
toml.features = [
  "std",
  "serde",
  "parse",
]
tokio.features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
  "signal",
]
tracing-subscriber.features = [
  "env-filter",
  "fmt",
]

[target.'cfg(target_os = "linux")'.dependencies]
# Workspace dependencies
keyring-store-freedesktop.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Workspace dependencies
keyring-store-keychain.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Workspace dependencies
windows.workspace = true

# Features
windows.features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
]

[target.'cfg(unix)'.dependencies]
# Workspace dependencies
libc.workspace = true

[dev-dependencies]
# Workspace dependencies
bitwarden-crypto.workspace = true
signature.workspace = true
ssh-key.workspace = true
tempfile.workspace = true

# Features
ssh-key.features = [
  "ed25519",
  "rsa",
]

[lints]
workspace = true
